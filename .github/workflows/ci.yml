name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests and WASI SQLite build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/bake-action@v5
        with:
          files: compose.test.yaml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Run Testament and canister integration tests
        run: |
          set -euo pipefail
          docker compose -f compose.test.yaml run --rm --no-TTY app bash -lc '
            set -euo pipefail
            cd /application
            ./scripts/test.sh
          '

      - name: Install package and compile external import smoke test
        run: |
          set -euo pipefail
          docker compose -f compose.test.yaml run --rm --no-TTY app bash -lc '
            set -euo pipefail
            cd /application
            ./scripts/install.sh
            nimble install -y
            tmpdir="$(mktemp -d)"
            cd "$tmpdir"
            printf "import ic_sqlite\necho IcSqliteVersion\n" > main.nim
            nim c -r main.nim
            if command -v ic_sqlite >/dev/null 2>&1; then
              echo "unexpected ic_sqlite executable installed" >&2
              exit 1
            fi
          '
