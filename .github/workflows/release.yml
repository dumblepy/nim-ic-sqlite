name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish prebuilt SQLite archive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' ic_sqlite.nimble | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/bake-action@v5
        with:
          files: compose.test.yaml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Verify repository archive is reproducible
        run: |
          set -euo pipefail
          docker compose -f compose.test.yaml run --rm --no-TTY app bash -lc '
            set -euo pipefail
            cd /application
            ./scripts/install.sh
            ./scripts/verify_prebuilt.sh
          '

      - name: Package release tarball
        run: |
          set -euo pipefail
          docker compose -f compose.test.yaml run --rm --no-TTY app bash -lc '
            set -euo pipefail
            cd /application
            ./scripts/package_prebuilt.sh
          '
          ls -la dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
